[case]
name = "formatter default spacing"
command = "format"
source = "default_spacing_input.pisp"
version = "1.0"

[formatter]
spaces_before_semicolon = 0
spaces_after_semicolon = 0
spaces_around_assignment = 1
spaces_around_operators = 1
blank_lines_before_println = 0

[expected]
stdout = """
let first_name: string = "Ada";# inline comment
let result: number = 1 + 2 * 3;
println("Result: " + result);
"""
