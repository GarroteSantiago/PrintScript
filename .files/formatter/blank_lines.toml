[case]
name = "formatter blank line before println"
command = "format"
source = "blank_lines_input.pisp"
version = "1.0"

[formatter]
spaces_before_semicolon = 0
spaces_after_semicolon = 0
spaces_around_assignment = 1
spaces_around_operators = 1
blank_lines_before_println = 1

[expected]
stdout = """
let text: string = "hello";

println(text);
"""
